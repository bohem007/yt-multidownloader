[project]
name = "yt-multidownloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: testy integracyjne z realnym pobraniem/siecią — pomijane przez `-m \"not slow\"`",
]
